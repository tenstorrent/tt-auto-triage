name: "(triage) Assign Owners"

on:
  workflow_call:
    inputs:
      issue-repo:
        description: "Repository that stores CI triage issues"
        type: string
        default: "ebanerjeeTT/issue_dump"
      target-repo:
        description: "Repository to read ownership metadata from"
        type: string
        default: "tenstorrent/tt-metal"
      ex-employees:
        description: >-
          Comma/whitespace-separated list of Slack IDs and/or GitHub logins for people who
          have left the company but whose Slack or GitHub org entries haven't been cleaned
          up yet. Any owner resolving to one of these IDs is rejected by the employment
          check and pushed to the agent fallback. Update this list when someone leaves.
        type: string
        default: "U05RWH3QUPM"  # Salar Hosseini (left 2026-04 per @ebanerjeeTT)
    secrets:
      AGGREGATE_READ_TOKEN:
        description: "Token with read access to target-repo and tenstorrent org"
        required: true
      ISSUE_WRITE_TOKEN:
        description: "Token with write access to issue-repo"
        required: true
      CURSOR_API_KEY:
        description: "Cursor API key for the agent fallback owner resolver"
        required: true
      SLACK_BOT_TOKEN:
        description: "Slack bot token; used to check Slack 'deleted' for employment check"
        required: false

permissions:
  contents: read

jobs:
  assign-owners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate required secrets
        env:
          AGGREGATE_READ_TOKEN: ${{ secrets.AGGREGATE_READ_TOKEN }}
          ISSUE_WRITE_TOKEN: ${{ secrets.ISSUE_WRITE_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          [ -n "$ISSUE_WRITE_TOKEN" ] || { echo "::error::ISSUE_WRITE_TOKEN is required"; exit 1; }
          [ -n "$AGGREGATE_READ_TOKEN" ] || { echo "::error::AGGREGATE_READ_TOKEN is required"; exit 1; }
          [ -n "$CURSOR_API_KEY" ] || { echo "::error::CURSOR_API_KEY is required"; exit 1; }

      - name: Checkout tt-auto-triage
        uses: actions/checkout@v4
        with:
          repository: tenstorrent/tt-auto-triage
          ref: ebanerjee/triage-assign-owners
          persist-credentials: false

      - name: Install Cursor CLI
        run: |
          set -euo pipefail
          install_script="$(mktemp)"
          curl --fail --show-error --silent --location \
            --proto '=https' --tlsv1.2 \
            https://cursor.com/install \
            -o "$install_script"
          bash "$install_script"
          rm -f "$install_script"
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Checkout target repo ownership data
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target-repo }}
          path: tt-metal
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            .github/actions/analyze-workflow-data/owners.json
            .github/CODEOWNERS
            .github/workflows
            tests/pipeline_reorg
          token: ${{ secrets.AGGREGATE_READ_TOKEN }}

      - name: Run assignee resolution stage
        env:
          GITHUB_TOKEN: ${{ secrets.AGGREGATE_READ_TOKEN }}
          AGGREGATE_READ_TOKEN: ${{ secrets.AGGREGATE_READ_TOKEN }}
          ISSUE_WRITE_TOKEN: ${{ secrets.ISSUE_WRITE_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ISSUE_REPO: ${{ inputs.issue-repo }}
          TARGET_REPO: ${{ inputs.target-repo }}
          EX_EMPLOYEES: ${{ inputs.ex-employees }}
          PIPELINE_REORG_DIR: tt-metal/tests/pipeline_reorg
          TARGET_REPO_ROOT: tt-metal
          SLACK_DUMP_PATH: slack_users.json
          SUMMARY_OUTPUT: summary.md
          PYTHONPATH: .
        run: python3 -m tools.ci.assign_owners

      - name: Publish summary to run output
        if: always()
        run: |
          if [ -f summary.md ]; then
            cat summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary produced." >> "$GITHUB_STEP_SUMMARY"
          fi
