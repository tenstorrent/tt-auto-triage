---
name: auto-triage
description: "[TEST] Retry-only mode — skips all analysis, retries the target failed job and reports to Slack."
inputs:
  workflow-name:
    description: Workflow file name to inspect.
    required: true
  job-name:
    description: Job/subjob name within the workflow.
    required: true
  copilot-pat:
    description: Personal Access Token for GitHub/Copilot authentication.
    required: true
  slack-test-only:
    description: (unused in retry-only test mode)
    required: false
    default: "false"
  slack_ts:
    description: "Slack message timestamp for threading replies"
    required: false
    default: ""
  allow-pings:
    description: "Whether to allow pinging users/groups in the Slack message."
    required: false
    default: "false"
  send-slack-message:
    description: "Whether to send a Slack message."
    required: false
    default: "true"
  enable-retry:
    description: "Whether to automatically retry Case 1/4 failures on supported hardware."
    required: false
    default: "true"
  cutoff-commit:
    description: (unused in retry-only test mode)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Stage auto_triage scripts
      shell: bash
      run: |
        set -euo pipefail
        TARGET="${GITHUB_WORKSPACE}/.auto_triage"
        rm -rf "$TARGET"
        mkdir -p "$TARGET"
        cp -R "${{ github.action_path }}/auto_triage/." "$TARGET/"
        find "$TARGET" -name "*.sh" -exec chmod +x {} \;
        chmod +x "$TARGET/"*.py 2>/dev/null || true
        echo "$TARGET" >> "$GITHUB_PATH"

    - name: Synthesize test data for retry
      shell: bash
      run: |
        set -euo pipefail
        TARGET="${GITHUB_WORKSPACE}/.auto_triage"

        echo "=== Ignoring input job-name ('${{ inputs.job-name }}'), hardcoding P150 BH device perf retry ==="

        mkdir -p "${TARGET}/auto_triage/data"
        mkdir -p "${TARGET}/auto_triage/output"
        mkdir -p "${TARGET}/auto_triage/logs"
        ln -sfn auto_triage/data   "${TARGET}/data"
        ln -sfn auto_triage/output "${TARGET}/output"
        ln -sfn auto_triage/logs   "${TARGET}/logs"

        cat > "${TARGET}/auto_triage/output/slack_message.json" << 'EOJSON'
        {
          "scenario": "Deterministic failure with identified commit",
          "case": "1",
          "failing_run_url": "https://github.com/tenstorrent/tt-metal/actions/runs/22489866421/job/65149810870",
          "failure_message": "FAILED models/demos/vision/classification/vit/blackhole/tests/test_vit_device_perf.py::test_vit_device_ops[10-device_params0] - RuntimeError: TT_FATAL @ /project/tt_metal/impl/allocator/bank_manager.cpp:403: num_shards.value() <= num_compute_banks\ninfo:\nExpected number of shards 120 to be less than or equal to total number of L1 banks 110 in compute cores",
          "slack_message": "[RETRY TEST] Deterministic failure detected — testing retry logic on P150 BH device perf",
          "notes": "",
          "commits": [{"sha": "0edc1834ed37956c65118fc5955fffa13489fc7f", "confidence": 1}]
        }
        EOJSON

        echo '{"runs": []}' > "${TARGET}/auto_triage/data/subjob_runs.json"

        cat > "${TARGET}/auto_triage/data/error_message.txt" << 'EOERR'
        FAILED models/demos/vision/classification/vit/blackhole/tests/test_vit_device_perf.py::test_vit_device_ops[10-device_params0] - RuntimeError: TT_FATAL @ /project/tt_metal/impl/allocator/bank_manager.cpp:403: num_shards.value() <= num_compute_banks
        info:
        Expected number of shards 120 to be less than or equal to total number of L1 banks 110 in compute cores
        EOERR

        echo "# Auto Triage — Retry Test" > "${TARGET}/auto_triage/output/explanation.md"

        echo "=== Test data ready ==="
        echo "slack_message.json:"
        cat "${TARGET}/auto_triage/output/slack_message.json"

    - name: Test find_job_in_attempt against real API data
      if: inputs.enable-retry == 'true'
      shell: bash
      run: |
        set -euo pipefail
        cd "${GITHUB_WORKSPACE}/.auto_triage"

        source modules/retry/run_trigger.sh

        RUN_ID="22489866421"
        JOB_NAME="device-perf / P150 BH device perf"
        EXPECTED_ATTEMPT_2_JOB="65180167614"

        echo "=== Test: find_job_in_attempt ==="
        echo "Run ID:   $RUN_ID"
        echo "Job name: $JOB_NAME"
        echo ""

        echo "--- Attempt 1 ---"
        job_id_1=$(find_job_in_attempt "$RUN_ID" "1" "$JOB_NAME")
        if [ -n "$job_id_1" ]; then
          echo "PASS: Found job in attempt 1: $job_id_1"
        else
          echo "FAIL: Could not find job in attempt 1"
          exit 1
        fi

        echo ""
        echo "--- Attempt 2 ---"
        job_id_2=$(find_job_in_attempt "$RUN_ID" "2" "$JOB_NAME")
        if [ -n "$job_id_2" ]; then
          echo "PASS: Found job in attempt 2: $job_id_2"
        else
          echo "FAIL: Could not find job in attempt 2"
          exit 1
        fi

        echo ""
        echo "--- Verify attempt 2 job ID ---"
        if [ "$job_id_2" = "$EXPECTED_ATTEMPT_2_JOB" ]; then
          echo "PASS: Attempt 2 job ID matches expected ($EXPECTED_ATTEMPT_2_JOB)"
        else
          echo "FAIL: Expected $EXPECTED_ATTEMPT_2_JOB, got $job_id_2"
          exit 1
        fi

        echo ""
        echo "--- Verify attempts return different job IDs ---"
        if [ "$job_id_1" != "$job_id_2" ]; then
          echo "PASS: Attempt 1 ($job_id_1) != Attempt 2 ($job_id_2)"
        else
          echo "FAIL: Both attempts returned the same job ID ($job_id_1)"
          exit 1
        fi

        echo ""
        echo "--- Test: non-existent job name ---"
        bogus=$(find_job_in_attempt "$RUN_ID" "2" "totally-fake-job-name")
        if [ -z "$bogus" ]; then
          echo "PASS: Non-existent job correctly returned empty"
        else
          echo "FAIL: Expected empty, got '$bogus'"
          exit 1
        fi

        echo ""
        echo "=== All find_job_in_attempt tests passed ==="
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_TOKEN: ${{ github.token }}

    - name: Debug output state
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        echo "=== Final state of output files ==="
        echo "--- slack_message.json ---"
        cat "${GITHUB_WORKSPACE}/.auto_triage/output/slack_message.json" 2>/dev/null || echo "(not found)"
        echo ""
        echo "--- explanation.md ---"
        cat "${GITHUB_WORKSPACE}/.auto_triage/output/explanation.md" 2>/dev/null || echo "(not found)"
        echo ""
        echo "--- retry_result.json ---"
        cat "${GITHUB_WORKSPACE}/.auto_triage/data/retry_result.json" 2>/dev/null || echo "(not found)"

    - name: Send Slack notification
      if: always() && inputs.send-slack-message == 'true'
      uses: tenstorrent/tt-auto-triage/.github/actions/slack-report-auto-triage@main
      with:
        channel_id: ${{ env.SLACK_CHANNEL_ID }}
        slack_message_path: .auto_triage/output/slack_message.json
        job_name: ${{ inputs.job-name }}
        workflow_name: ${{ inputs.workflow-name }}
        slack_ts: ${{ inputs.slack_ts }}
        allow_pings: ${{ inputs.allow-pings }}

    - name: Publish triage report to summary
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        REPORT="${GITHUB_WORKSPACE}/.auto_triage/output/explanation.md"
        if [ -f "$REPORT" ]; then
            {
              echo "## Auto Triage Report (Retry Test)"
              cat "$REPORT"
            } >> "$GITHUB_STEP_SUMMARY"
        else
            echo "No explanation produced." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload auto-triage data
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: auto-triage-data
        path: ${{ github.workspace }}/.auto_triage/data
        if-no-files-found: ignore
        include-hidden-files: true

    - name: Upload auto-triage output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: auto-triage-output
        path: ${{ github.workspace }}/.auto_triage/output
        if-no-files-found: ignore
        include-hidden-files: true
