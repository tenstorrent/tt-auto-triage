---
name: auto-triage
description: Run auto_triage automation with GitHub Copilot CLI and GitHub API access.
inputs:
  workflow-name:
    description: Workflow file name to inspect.
    required: true
  job-name:
    description: Job/subjob name within the workflow.
    required: true
  copilot-pat:
    description: Personal Access Token for GitHub/Copilot authentication.
    required: true
  slack-test-only:
    description: Skip analysis steps and only send a canned Slack message.
    required: false
    default: "false"
  slack_ts:
    description: "Slack message timestamp for threading replies"
    required: false
    default: ""
  allow-pings:
    description: "Whether to allow pinging users/groups in the Slack message."
    required: false
    default: "false"
  send-slack-message:
    description: "Whether to send a Slack message."
    required: false
    default: "true"
  enable-retry:
    description: "Whether to automatically retry Case 1/4 failures on supported hardware (N150/N300/P100A/P150/P300) to confirm determinism."
    required: false
    default: "true"
  cutoff-commit:
    description: "Optional commit SHA to ignore all runs on commits newer than this one. Useful for testing retry logic on older failures when newer runs have already passed."
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Stage auto_triage scripts
      shell: bash
      run: |
        set -euo pipefail
        TARGET="${GITHUB_WORKSPACE}/.auto_triage"
        rm -rf "$TARGET"
        mkdir -p "$TARGET"
        # Copy triage tooling
        cp -R "${{ github.action_path }}/auto_triage/." "$TARGET/"
        chmod +x "$TARGET/"*.sh 2>/dev/null || true
        chmod +x "$TARGET/"*.py 2>/dev/null || true
        # Mirror the checked-out repo into the workspace for the LLM (excluding the workspace itself)
        rsync -a --delete \
          --exclude '.auto_triage/' \
          --exclude '.git/' \
          --exclude 'auto_triage/' \
          "$GITHUB_WORKSPACE"/ "$TARGET/workspace/"
        echo "$TARGET" >> "$GITHUB_PATH"
        # Initialize cancel.json with default state - this is the single source of truth for cancellation
        echo '{"should_cancel": false, "message": ""}' > "$TARGET/cancel.json"

    - name: Download Slack directory
      shell: bash
      run: |
        set -euo pipefail
        cd "${GITHUB_WORKSPACE}/.auto_triage"
        pip install requests
        ./download_slack_directory.py --pretty

    - name: Debug - test Slack directory lookup
      shell: bash
      run: |
        set -euo pipefail
        cd "${GITHUB_WORKSPACE}/.auto_triage"

        echo "=== File locations ==="
        echo "CWD: $(pwd)"
        echo "Looking for directory files..."
        find . -name "slack_directory.json" -o -name "slack_groups.json" | while read f; do
          echo "  FOUND: $f ($(wc -c < "$f") bytes)"
        done

        echo ""
        echo "=== Path that slack-report uses (from GITHUB_WORKSPACE) ==="
        WORKSPACE_DIR="${GITHUB_WORKSPACE}"
        for p in \
          ".auto_triage/data/slack_directory.json" \
          ".auto_triage/auto_triage/data/slack_directory.json"; do
          FULL="${WORKSPACE_DIR}/${p}"
          if [ -f "$FULL" ]; then
            echo "  EXISTS: $p ($(wc -c < "$FULL") bytes)"
          else
            echo "  MISSING: $p"
          fi
        done

        echo ""
        echo "=== Directory contents ==="
        echo "Users count: $(jq '.users | length' auto_triage/data/slack_directory.json)"
        echo "Groups count: $(jq '.usergroups | length' auto_triage/data/slack_groups.json)"

        echo ""
        echo "=== Search for Evan Small with get_slack_ids.py ==="
        python3 auto_triage/get_slack_ids.py "Evan Small" --json || true

        echo ""
        echo "=== All users matching evan or small ==="
        python3 << 'EOF'
        import json

        with open("auto_triage/data/slack_directory.json") as f:
            data = json.load(f)
        users = data.get("users", [])
        print(f"Total users: {len(users)}")

        for u in users:
            fields = {
                "real_name": u.get("real_name") or "",
                "display_name": u.get("display_name") or "",
                "username": u.get("username") or "",
            }
            combined = " ".join(fields.values()).lower()
            if "evan" in combined or "small" in combined:
                print(f"  id: {u.get('id')}")
                for k, v in fields.items():
                    print(f"    {k}: '{v}'")
                print()
        EOF

        echo ""
        echo "=== Exact lookup test (same logic as action.yml) ==="
        python3 << 'EOF'
        import json, os

        name = "Evan Small"
        nl = name.lower()
        print(f"Searching for: '{name}' (lowered: '{nl}')")

        slack_dir = "auto_triage/data/slack_directory.json"
        slack_groups = "auto_triage/data/slack_groups.json"
        print(f"slack_directory exists: {os.path.exists(slack_dir)}")
        print(f"slack_groups exists: {os.path.exists(slack_groups)}")

        with open(slack_dir) as f:
            users_data = json.load(f)
        users = users_data.get("users", [])
        print(f"Users loaded: {len(users)}")

        found = False
        for u in users:
            if not isinstance(u, dict):
                continue
            for field in ("real_name", "display_name", "username"):
                val = (u.get(field) or "").lower()
                if val == nl:
                    print(f"EXACT MATCH on {field}: id={u.get('id')}, value='{u.get(field)}'")
                    found = True
                elif nl in val:
                    print(f"SUBSTRING of {field}: id={u.get('id')}, value='{u.get(field)}'")
                elif val in nl and val:
                    print(f"REVERSE SUBSTRING of {field}: id={u.get('id')}, value='{u.get(field)}'")

        if not found:
            print("NO EXACT MATCH in users")

        with open(slack_groups) as f:
            groups_data = json.load(f)
        groups = groups_data.get("usergroups", [])
        print(f"\nGroups loaded: {len(groups)}")
        for g in groups:
            if not isinstance(g, dict):
                continue
            for field in ("name", "handle"):
                val = (g.get(field) or "").lower()
                if val == nl:
                    print(f"EXACT MATCH on {field}: id={g.get('id')}, value='{g.get(field)}'")
                elif nl in val or (val in nl and val):
                    print(f"PARTIAL on {field}: id={g.get('id')}, value='{g.get(field)}'")
        EOF

        echo ""
        echo "=== First 3 user entries (raw structure) ==="
        jq '.users[:3]' auto_triage/data/slack_directory.json

    - name: Create mock slack_message.json for Slack step
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${GITHUB_WORKSPACE}/.auto_triage/output"
        cat > "${GITHUB_WORKSPACE}/.auto_triage/output/slack_message.json" << 'MOCKEOF'
        {
          "case": "2",
          "scenario": "Slack directory lookup test",
          "notes": "Testing JOB OWNER ping resolution."
        }
        MOCKEOF

    - name: Send Slack notification
      if: always()
      uses: tenstorrent/tt-auto-triage/.github/actions/slack-report-auto-triage@ebanerjee/shift-pinging-owners
      with:
        channel_id: ${{ env.SLACK_CHANNEL_ID }}
        slack_message_path: .auto_triage/output/slack_message.json
        job_name: ${{ inputs.job-name }}
        workflow_name: ${{ inputs.workflow-name }}
        slack_ts: ${{ inputs.slack_ts }}
        allow_pings: ${{ inputs.allow-pings }}
