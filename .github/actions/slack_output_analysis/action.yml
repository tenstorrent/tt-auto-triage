name: sync-slack-errors-to-github
description: Sync Slack error messages to GitHub issues, with options to update or rebuild from scratch
inputs:
  github_token:
    description: GitHub Personal Access Token for creating/updating issues
    required: true
  slack_token:
    description: Slack Bot Token for fetching messages
    required: true
  channel_id:
    description: Slack channel ID to fetch messages from
    required: true
  update_mode:
    description: "Mode: 'update' to sync new errors, 'rebuild' to recreate all issues from scratch"
    required: false
    default: "update"
  start_date:
    description: "Start date for fetching Slack messages (format: 'January 1, 2026')"
    required: false
    default: "January 1, 2026"
  end_date:
    description: "End date (cutoff) for fetching Slack messages (format: 'January 31, 2026'). Messages after this date are ignored. Leave empty for no cutoff."
    required: false
    default: ""
  workflow_file:
    description: "Workflow file path (e.g., '.github/workflows/analyze-ND-failures.yml') for finding previous runs to create incremental report. Leave empty to skip incremental report."
    required: false
    default: ""
  github_repo_owner:
    description: "GitHub repository owner for creating issues. Defaults to the current repository owner."
    required: false
    default: ""
  github_repo_name:
    description: "GitHub repository name for creating issues. Defaults to the current repository name."
    required: false
    default: ""
  project_owner:
    description: "GitHub project owner (for project board integration). Leave empty to skip project board."
    required: false
    default: ""
  project_name:
    description: "GitHub project name (for project board integration). Leave empty to skip project board."
    required: false
    default: ""
outputs:
  incremental_report_path:
    description: "Path to the incremental error report (new entries only)"
    value: ${{ steps.incremental.outputs.path }}
runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      shell: bash
      run: |
        pip install --upgrade pip
        pip install slack-sdk sentence-transformers scikit-learn rapidfuzz numpy requests
      working-directory: ${{ github.action_path }}

    - name: Create secrets.json
      shell: bash
      run: |
        set -euo pipefail
        
        # Use provided values or default to current repository
        REPO_OWNER="${{ inputs.github_repo_owner }}"
        REPO_NAME="${{ inputs.github_repo_name }}"
        
        if [ -z "$REPO_OWNER" ]; then
          REPO_OWNER="${{ github.repository_owner }}"
        fi
        
        if [ -z "$REPO_NAME" ]; then
          REPO_NAME="${{ github.event.repository.name }}"
        fi
        
        cat > "${{ github.action_path }}/secrets.json" << EOF
        {
          "github_token": "${{ inputs.github_token }}",
          "github_repo_owner": "$REPO_OWNER",
          "github_repo_name": "$REPO_NAME",
          "slack_token": "${{ inputs.slack_token }}",
          "channel_id": "${{ inputs.channel_id }}",
          "project_owner": "${{ inputs.project_owner }}",
          "project_name": "${{ inputs.project_name }}",
          "project_number": "",
          "project_field_id": ""
        }
        EOF
        echo "Created secrets.json with repo: $REPO_OWNER/$REPO_NAME"
      working-directory: ${{ github.action_path }}

    - name: Delete existing build_slack_export_with_threads.json if it exists
      shell: bash
      run: |
        set -euo pipefail
        if [ -f "${{ github.action_path }}/build_slack_export_with_threads.json" ]; then
          echo "Deleting existing build_slack_export_with_threads.json..."
          rm -f "${{ github.action_path }}/build_slack_export_with_threads.json"
        else
          echo "build_slack_export_with_threads.json does not exist, skipping deletion"
        fi
      working-directory: ${{ github.action_path }}

    - name: Fetch Slack messages and create build_slack_export_with_threads.json
      shell: bash
      run: |
        set -euo pipefail
        cd "${{ github.action_path }}"
        python3 get_and_analyze_slack.py
      env:
        PYTHONUNBUFFERED: 1
        SLACK_START_DATE: ${{ inputs.start_date || 'January 1, 2026' }}
        SLACK_END_DATE: ${{ inputs.end_date || '' }}

    - name: Extract errors from Slack export
      shell: bash
      run: |
        set -euo pipefail
        cd "${{ github.action_path }}"
        python3 extract_errors.py
      env:
        PYTHONUNBUFFERED: 1
        DATE_RANGE_START: ${{ inputs.start_date || '' }}
        DATE_RANGE_END: ${{ inputs.end_date || '' }}

    - name: Group similar errors
      if: inputs.update_mode == 'rebuild'
      shell: bash
      run: |
        set -euo pipefail
        cd "${{ github.action_path }}"
        python3 group_similar_errors.py
      env:
        PYTHONUNBUFFERED: 1

    - name: Rebuild issues from scratch
      if: inputs.update_mode == 'rebuild'
      shell: bash
      run: |
        set -euo pipefail
        cd "${{ github.action_path }}"
        python3 create_github_issues.py
      env:
        PYTHONUNBUFFERED: 1
        GITHUB_TOKEN: ${{ inputs.github_token }}

    - name: Update issues with new errors
      if: inputs.update_mode == 'update'
      shell: bash
      run: |
        set -euo pipefail
        cd "${{ github.action_path }}"
        python3 sync_new_errors.py
      env:
        PYTHONUNBUFFERED: 1
        GITHUB_TOKEN: ${{ inputs.github_token }}
        DATE_RANGE_START: ${{ inputs.start_date || '' }}
        DATE_RANGE_END: ${{ inputs.end_date || '' }}

    - name: Generate error report
      shell: bash
      run: |
        set -euo pipefail
        cd "${{ github.action_path }}"
        python3 generate_error_report.py
        # Copy to workspace root for artifact upload (artifact paths must be relative to workspace)
        if [ -f error_report.json ]; then
          cp error_report.json "${{ github.workspace }}/error_report.json"
        fi
      env:
        PYTHONUNBUFFERED: 1
        GITHUB_TOKEN: ${{ inputs.github_token }}

    - name: Upload error report as artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: error-report
        path: error_report.json
        retention-days: 30

    # =========================================================================
    # INCREMENTAL REPORT: Create an incrememntal error report with only NEW entries
    # This compares against the previous run's error_report.json
    # =========================================================================

    - name: Find previous successful run
      id: prev_run
      if: inputs.workflow_file != ''
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const workflow_id = '${{ inputs.workflow_file }}';
          const currentRunId = context.runId;
          
          console.log(`Looking for previous successful runs of ${workflow_id} on main...`);
          console.log(`Current run ID: ${currentRunId}`);
          
          try {
            const resp = await github.request('GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs', {
              owner,
              repo,
              workflow_id,
              branch: 'main',
              status: 'completed',
              per_page: 20
            });
            
            // Filter to successful runs that aren't the current run
            // Use String() to ensure consistent type comparison
            const runs = (resp.data.workflow_runs || []).filter(r => 
              r.conclusion === 'success' && String(r.id) !== String(currentRunId)
            );
            
            const run = runs[0];
            const selectedId = run ? String(run.id) : '';
            
            if (selectedId) {
              console.log(`Found previous successful run: ${selectedId}`);
            } else {
              console.log('No previous successful run found');
            }
            
            core.setOutput('run_id', selectedId);
          } catch (error) {
            console.log(`Warning: Could not fetch previous runs: ${error.message}`);
            core.setOutput('run_id', '');
          }

    - name: Download previous error report
      id: download_prev
      if: inputs.workflow_file != '' && steps.prev_run.outputs.run_id != ''
      continue-on-error: true
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: error-report
        path: ${{ github.workspace }}/prev_report
        run-id: ${{ steps.prev_run.outputs.run_id }}
        github-token: ${{ inputs.github_token }}

    - name: Create incremental error report
      id: incremental
      shell: bash
      run: |
        set -euo pipefail
        cd "${{ github.action_path }}"
        
        echo "=== Incremental Report Debug Info ==="
        echo "workflow_file input: '${{ inputs.workflow_file }}'"
        echo "Previous run ID found: '${{ steps.prev_run.outputs.run_id }}'"
        echo "Download step outcome: '${{ steps.download_prev.outcome }}'"
        
        # Set path to previous report if it was downloaded
        PREV_REPORT=""
        if [ -f "${{ github.workspace }}/prev_report/error_report.json" ]; then
          PREV_REPORT="${{ github.workspace }}/prev_report/error_report.json"
          echo "✓ Found previous report at: $PREV_REPORT"
        else
          echo "✗ No previous report found at: ${{ github.workspace }}/prev_report/error_report.json"
          if [ -z "${{ inputs.workflow_file }}" ]; then
            echo "  Reason: workflow_file input was not provided"
          elif [ -z "${{ steps.prev_run.outputs.run_id }}" ]; then
            echo "  Reason: No previous successful run was found"
          else
            echo "  Reason: Download may have failed (check logs above)"
          fi
          echo "  All entries will be considered new"
        fi
        
        # Run the incremental report script
        PREVIOUS_REPORT_PATH="$PREV_REPORT" python3 create_incremental_report.py
        
        # Copy to workspace root for artifact upload
        if [ -f incremental_error_report.json ]; then
          cp incremental_error_report.json "${{ github.workspace }}/incremental_error_report.json"
          echo "path=${{ github.workspace }}/incremental_error_report.json" >> $GITHUB_OUTPUT
        fi
      env:
        PYTHONUNBUFFERED: 1

    - name: Upload incremental error report as artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: incremental-error-report
        path: incremental_error_report.json
        if-no-files-found: ignore
        retention-days: 30