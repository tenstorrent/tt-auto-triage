name: "Auto Triage Slack Reporter"
description: "Format slack_message.json and send it to Slack."
inputs:
  slack_webhook_url:
    description: "Webhook URL for the Slack channel to be posted to (deprecated in favor of channel_id + env.SLACK_BOT_TOKEN)."
    required: false
  channel_id:
    description: "Slack Channel ID to post message to."
    required: false
  slack_message_path:
    description: "Path to slack_message.json."
    required: false
    default: .auto_triage/output/slack_message.json
  job_name:
    description: "The job/subjob name (from user input)."
    required: true
  workflow_name:
    description: "The workflow name (from user input)."
    required: true
  auto_fix_meta_path:
    description: "Optional metadata JSON containing auto-fix PR info."
    required: false
    default: ""
  slack_ts:
    description: "Slack message timestamp for threading replies"
    required: false
    default: ""
  allow_pings:
    description: "Whether to allow pinging users/groups in the message."
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Fetch parent message and extract job owner
      id: fetch_owner
      if: always()
      shell: bash
      env:
        SLACK_TS: ${{ inputs.slack_ts }}
        CHANNEL_ID: ${{ inputs.channel_id }}
        JOB_NAME: ${{ inputs.job_name }}
      run: |
        set -uo pipefail

        JOB_OWNER_FILE=".auto_triage/data/job_owner.json"
        mkdir -p "$(dirname "$JOB_OWNER_FILE")"
        echo '[]' > "$JOB_OWNER_FILE"

        # Wrap in a function so failures are non-fatal
        fetch_and_parse_owner() {

        if [ -z "${SLACK_TS:-}" ] || [ -z "${CHANNEL_ID:-}" ] || [ -z "${SLACK_BOT_TOKEN:-}" ]; then
          echo "Missing Slack credentials or thread timestamp, skipping parent message fetch"
          return 0
        fi

        echo "Fetching parent Slack thread (ts=${SLACK_TS}, channel=${CHANNEL_ID})..."

        RESPONSE=$(curl -s -X GET \
          "https://slack.com/api/conversations.replies?channel=${CHANNEL_ID}&ts=${SLACK_TS}&limit=100&inclusive=true" \
          -H "Authorization: Bearer ${SLACK_BOT_TOKEN}")

        OK_STATUS=$(echo "$RESPONSE" | jq -r '.ok // false')
        if [ "$OK_STATUS" != "true" ]; then
          echo "Failed to fetch parent message: $(echo "$RESPONSE" | jq -r '.error // "unknown"')"
          exit 0
        fi

        echo "$RESPONSE" | jq -r '[.messages[] | if .blocks then (.blocks[] | .text.text // empty) else (.text // empty) end] | join("\n")' > /tmp/thread_text.txt
        echo "Thread fetched ($(wc -c < /tmp/thread_text.txt) bytes). Searching for job: ${JOB_NAME}"

        export JOB_OWNER_FILE
        python3 << 'PYEOF'
        import json, os, re

        job_name = os.environ["JOB_NAME"]
        owner_file = os.environ["JOB_OWNER_FILE"]
        owners_result = []

        with open("/tmp/thread_text.txt") as f:
            text = f.read()

        for line in text.split("\n"):
            # Strip Slack link formatting for matching: <url|label> -> label
            clean = re.sub(r"<[^>]+\|([^>]+)>", r"\1", line)
            clean = re.sub(r"<[^>]+>", "", clean)

            if job_name.lower() not in clean.lower():
                continue

            print(f"Matched line: {clean[:200]}")

            # Owner names follow the job description, prefixed with @
            # Names are letter-based (no leading digits) to avoid capturing
            # trailing text like "27 other pipelines are failing"
            found = re.findall(r"@([A-Za-z][A-Za-z .\-]*[A-Za-z])", clean)
            for name in found:
                name = re.sub(r"\s{2,}", " ", name).strip()
                if name.lower() in job_name.lower():
                    continue
                owners_result.append({"name": name, "slack_id": ""})

            if owners_result:
                break

        # Look up Slack IDs with exact case-insensitive matching
        slack_dir = ".auto_triage/auto_triage/data/slack_directory.json"
        slack_groups = ".auto_triage/auto_triage/data/slack_groups.json"
        users_data = json.load(open(slack_dir)) if os.path.exists(slack_dir) else {}
        groups_data = json.load(open(slack_groups)) if os.path.exists(slack_groups) else {}
        users = users_data.get("users", []) if isinstance(users_data, dict) else users_data
        groups = groups_data.get("usergroups", []) if isinstance(groups_data, dict) else groups_data

        for owner in owners_result:
            nl = owner["name"].lower()
            for u in users:
                if not isinstance(u, dict) or u.get("deleted") or u.get("is_bot"):
                    continue
                if any((u.get(f) or "").lower() == nl for f in ("real_name", "display_name", "username")):
                    owner["slack_id"] = u.get("id", "")
                    break
            if not owner["slack_id"]:
                for g in groups:
                    if not isinstance(g, dict):
                        continue
                    if any((g.get(f) or "").lower() == nl for f in ("name", "handle")):
                        owner["slack_id"] = g.get("id", "")
                        break

        with open(owner_file, "w") as f:
            json.dump(owners_result, f, indent=2)

        for o in owners_result:
            print(f"Owner: {o['name']}, Slack ID: {o['slack_id'] or 'not found'}")
        print(f"Total: {len(owners_result)} owner(s) extracted")
        PYEOF

        } # end fetch_and_parse_owner

        # Run but don't fail the pipeline if owner extraction fails
        fetch_and_parse_owner || echo "Warning: Job owner extraction failed (non-fatal), continuing without JOB OWNER field"

    - name: Build Slack payload
      id: build
      shell: bash
      env:
        MESSAGE_PATH: ${{ inputs.slack_message_path }}
        AUTO_FIX_META: ${{ inputs.auto_fix_meta_path }}
        SLACK_TS: ${{ inputs.slack_ts }}
        ALLOW_PINGS: ${{ inputs.allow_pings }}
      run: |
        set -euo pipefail
        
        # Prepare context variables
        RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        RUN_LABEL="full_report_link #${GITHUB_RUN_NUMBER:-$GITHUB_RUN_ID}"
        JOB_NAME_VALUE="${{ inputs.job_name }}"
        WORKFLOW_NAME_VALUE="${{ inputs.workflow_name }}"
        
        # Check for cancellation FIRST
        CANCEL_FILE=".auto_triage/cancel.json"
        if [ -f "$CANCEL_FILE" ]; then
          SHOULD_CANCEL=$(jq -r '.should_cancel // false' "$CANCEL_FILE")
          if [ "$SHOULD_CANCEL" = "true" ]; then
            # The RAW_MESSAGE now contains ONLY the core error text (Fix 1 applied in find_boundaries.sh).
            RAW_MESSAGE=$(jq -r '.message // "Auto-triage cancelled"' "$CANCEL_FILE")
            
            # 1. Convert literal "\n" sequences (from jq) to actual newlines (\n)
            CORE_MESSAGE_WITH_NEWLINES=$(printf '%s' "$RAW_MESSAGE" | awk '{gsub(/\\n/, "\n"); print}')

            echo "Cancellation detected:"
            printf '%s\n' "$CORE_MESSAGE_WITH_NEWLINES"
            
            # 2. Read error message from error_message.txt if it exists
            ERROR_MSG_FILE=".auto_triage/data/error_message.txt"
            ERROR_CONTENT=""
            if [ -f "$ERROR_MSG_FILE" ] && [ -s "$ERROR_MSG_FILE" ]; then
              # Read error message (limit to first 20 lines to avoid huge messages)
              ERROR_CONTENT=$(cat "$ERROR_MSG_FILE" | head -20)
            fi
            
            # 3. Extract latest failing job URL from subjob_runs.json if available
            FAILING_RUN_URL=""
            FAILING_RUN_LABEL=""
            SUBJOB_RUNS_FILE=".auto_triage/data/subjob_runs.json"
            if [ -f "$SUBJOB_RUNS_FILE" ]; then
              # Find the latest failing run (highest run_number with status "failure")
              LATEST_FAILURE=$(jq -r '
                if type == "array" then . else (.runs // []) end
                | map(select(.status == "failure"))
                | sort_by(.run_number // 0)
                | last
                // empty
              ' "$SUBJOB_RUNS_FILE" 2>/dev/null)
              
              if [ -n "$LATEST_FAILURE" ] && [ "$LATEST_FAILURE" != "null" ]; then
                FAILING_RUN_URL=$(echo "$LATEST_FAILURE" | jq -r '.job_url // .run_url // ""' 2>/dev/null)
                RUN_ID=$(echo "$LATEST_FAILURE" | jq -r '.run_id // .job_id // ""' 2>/dev/null)
                if [ -n "$FAILING_RUN_URL" ] && [ "$FAILING_RUN_URL" != "null" ]; then
                  if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
                    FAILING_RUN_LABEL="Run #${RUN_ID} (latest failure)"
                  else
                    FAILING_RUN_LABEL="latest failure"
                  fi
                fi
              fi
            fi
            
            # 4. Construct message using jq to properly handle escaping and newlines
            # Include error message and failing run link if available
            PAYLOAD_FILE=".auto_triage/slack_payload.json"
            mkdir -p "$(dirname "$PAYLOAD_FILE")"
            
            # Build message using jq for proper escaping
            if [ -n "$SLACK_TS" ]; then
              if [ -n "$FAILING_RUN_URL" ] && [ -n "$FAILING_RUN_LABEL" ] && [ -n "$ERROR_CONTENT" ]; then
                # All sections: failing run + error message
                jq -n \
                  --arg cancel_msg "$CORE_MESSAGE_WITH_NEWLINES" \
                  --arg workflow "$WORKFLOW_NAME_VALUE" \
                  --arg job "$JOB_NAME_VALUE" \
                  --arg run_url "$RUN_URL" \
                  --arg run_label "$RUN_LABEL" \
                  --arg failing_run_url "$FAILING_RUN_URL" \
                  --arg failing_run_label "$FAILING_RUN_LABEL" \
                  --arg error_msg "$ERROR_CONTENT" \
                  --arg thread_ts "$SLACK_TS" \
                  '{
                    text: ("*Auto-triage cancelled:*\n" + $cancel_msg + "\n*Workflow:* " + $workflow + "\n*Job:* " + $job + "\n*Run:* <" + $run_url + "|" + $run_label + ">\n*FAILING RUN:* <" + $failing_run_url + "|" + $failing_run_label + ">\n\n*FAILURE MESSAGE:*\n```" + $error_msg + "```\n\n---\n_DISCLAIMER: This analysis has been done by AI. Do not take the results as absolute truth since it has been inaccurate in the past._"),
                    thread_ts: $thread_ts
                  }' > "$PAYLOAD_FILE"
              elif [ -n "$FAILING_RUN_URL" ] && [ -n "$FAILING_RUN_LABEL" ]; then
                # Only failing run, no error message
                jq -n \
                  --arg cancel_msg "$CORE_MESSAGE_WITH_NEWLINES" \
                  --arg workflow "$WORKFLOW_NAME_VALUE" \
                  --arg job "$JOB_NAME_VALUE" \
                  --arg run_url "$RUN_URL" \
                  --arg run_label "$RUN_LABEL" \
                  --arg failing_run_url "$FAILING_RUN_URL" \
                  --arg failing_run_label "$FAILING_RUN_LABEL" \
                  --arg thread_ts "$SLACK_TS" \
                  '{
                    text: ("*Auto-triage cancelled:*\n" + $cancel_msg + "\n*Workflow:* " + $workflow + "\n*Job:* " + $job + "\n*Run:* <" + $run_url + "|" + $run_label + ">\n*FAILING RUN:* <" + $failing_run_url + "|" + $failing_run_label + ">\n\n---\n_DISCLAIMER: This analysis has been done by AI. Do not take the results as absolute truth since it has been inaccurate in the past._"),
                    thread_ts: $thread_ts
                  }' > "$PAYLOAD_FILE"
              elif [ -n "$ERROR_CONTENT" ]; then
                # Only error message, no failing run
                jq -n \
                  --arg cancel_msg "$CORE_MESSAGE_WITH_NEWLINES" \
                  --arg workflow "$WORKFLOW_NAME_VALUE" \
                  --arg job "$JOB_NAME_VALUE" \
                  --arg run_url "$RUN_URL" \
                  --arg run_label "$RUN_LABEL" \
                  --arg error_msg "$ERROR_CONTENT" \
                  --arg thread_ts "$SLACK_TS" \
                  '{
                    text: ("*Auto-triage cancelled:*\n" + $cancel_msg + "\n*Workflow:* " + $workflow + "\n*Job:* " + $job + "\n*Run:* <" + $run_url + "|" + $run_label + ">\n\n*FAILURE MESSAGE:*\n```" + $error_msg + "```\n\n---\n_DISCLAIMER: This analysis has been done by AI. Do not take the results as absolute truth since it has been inaccurate in the past._"),
                    thread_ts: $thread_ts
                  }' > "$PAYLOAD_FILE"
              else
                # Neither failing run nor error message
                jq -n \
                  --arg cancel_msg "$CORE_MESSAGE_WITH_NEWLINES" \
                  --arg workflow "$WORKFLOW_NAME_VALUE" \
                  --arg job "$JOB_NAME_VALUE" \
                  --arg run_url "$RUN_URL" \
                  --arg run_label "$RUN_LABEL" \
                  --arg thread_ts "$SLACK_TS" \
                  '{
                    text: ("*Auto-triage cancelled:*\n" + $cancel_msg + "\n*Workflow:* " + $workflow + "\n*Job:* " + $job + "\n*Run:* <" + $run_url + "|" + $run_label + ">\n\n---\n_DISCLAIMER: This analysis has been done by AI. Do not take the results as absolute truth since it has been inaccurate in the past._"),
                    thread_ts: $thread_ts
                  }' > "$PAYLOAD_FILE"
              fi
            else
              if [ -n "$FAILING_RUN_URL" ] && [ -n "$FAILING_RUN_LABEL" ] && [ -n "$ERROR_CONTENT" ]; then
                # All sections: failing run + error message
                jq -n \
                  --arg cancel_msg "$CORE_MESSAGE_WITH_NEWLINES" \
                  --arg workflow "$WORKFLOW_NAME_VALUE" \
                  --arg job "$JOB_NAME_VALUE" \
                  --arg run_url "$RUN_URL" \
                  --arg run_label "$RUN_LABEL" \
                  --arg failing_run_url "$FAILING_RUN_URL" \
                  --arg failing_run_label "$FAILING_RUN_LABEL" \
                  --arg error_msg "$ERROR_CONTENT" \
                  '{
                    text: ("*Auto-triage cancelled:*\n" + $cancel_msg + "\n*Workflow:* " + $workflow + "\n*Job:* " + $job + "\n*Run:* <" + $run_url + "|" + $run_label + ">\n*FAILING RUN:* <" + $failing_run_url + "|" + $failing_run_label + ">\n\n*FAILURE MESSAGE:*\n```" + $error_msg + "```\n\n---\n_DISCLAIMER: This analysis has been done by AI. Do not take the results as absolute truth since it has been inaccurate in the past._")
                  }' > "$PAYLOAD_FILE"
              elif [ -n "$FAILING_RUN_URL" ] && [ -n "$FAILING_RUN_LABEL" ]; then
                # Only failing run, no error message
                jq -n \
                  --arg cancel_msg "$CORE_MESSAGE_WITH_NEWLINES" \
                  --arg workflow "$WORKFLOW_NAME_VALUE" \
                  --arg job "$JOB_NAME_VALUE" \
                  --arg run_url "$RUN_URL" \
                  --arg run_label "$RUN_LABEL" \
                  --arg failing_run_url "$FAILING_RUN_URL" \
                  --arg failing_run_label "$FAILING_RUN_LABEL" \
                  '{
                    text: ("*Auto-triage cancelled:*\n" + $cancel_msg + "\n*Workflow:* " + $workflow + "\n*Job:* " + $job + "\n*Run:* <" + $run_url + "|" + $run_label + ">\n*FAILING RUN:* <" + $failing_run_url + "|" + $failing_run_label + ">\n\n---\n_DISCLAIMER: This analysis has been done by AI. Do not take the results as absolute truth since it has been inaccurate in the past._")
                  }' > "$PAYLOAD_FILE"
              elif [ -n "$ERROR_CONTENT" ]; then
                # Only error message, no failing run
                jq -n \
                  --arg cancel_msg "$CORE_MESSAGE_WITH_NEWLINES" \
                  --arg workflow "$WORKFLOW_NAME_VALUE" \
                  --arg job "$JOB_NAME_VALUE" \
                  --arg run_url "$RUN_URL" \
                  --arg run_label "$RUN_LABEL" \
                  --arg error_msg "$ERROR_CONTENT" \
                  '{
                    text: ("*Auto-triage cancelled:*\n" + $cancel_msg + "\n*Workflow:* " + $workflow + "\n*Job:* " + $job + "\n*Run:* <" + $run_url + "|" + $run_label + ">\n\n*FAILURE MESSAGE:*\n```" + $error_msg + "```\n\n---\n_DISCLAIMER: This analysis has been done by AI. Do not take the results as absolute truth since it has been inaccurate in the past._")
                  }' > "$PAYLOAD_FILE"
              else
                # Neither failing run nor error message
                jq -n \
                  --arg cancel_msg "$CORE_MESSAGE_WITH_NEWLINES" \
                  --arg workflow "$WORKFLOW_NAME_VALUE" \
                  --arg job "$JOB_NAME_VALUE" \
                  --arg run_url "$RUN_URL" \
                  --arg run_label "$RUN_LABEL" \
                  '{
                    text: ("*Auto-triage cancelled:*\n" + $cancel_msg + "\n*Workflow:* " + $workflow + "\n*Job:* " + $job + "\n*Run:* <" + $run_url + "|" + $run_label + ">\n\n---\n_DISCLAIMER: This analysis has been done by AI. Do not take the results as absolute truth since it has been inaccurate in the past._")
                  }' > "$PAYLOAD_FILE"
              fi
            fi
            
            echo "payload_file=$PAYLOAD_FILE" >> "$GITHUB_OUTPUT"
            echo "has_payload=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi

        if [ -z "${MESSAGE_PATH:-}" ]; then
          echo "has_payload=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ ! -f "$MESSAGE_PATH" ]; then
          echo "Slack message file '$MESSAGE_PATH' not found; skipping notification."
          echo "has_payload=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        
        # Force the JSON payload to reflect the user-provided job name and workflow name so downstream
        # tooling (and the final Slack message) never rely on the LLM's guess.
        if [ -n "$JOB_NAME_VALUE" ] || [ -n "$WORKFLOW_NAME_VALUE" ]; then
          TMP_JSON=$(mktemp)
          if [ -n "$JOB_NAME_VALUE" ] && [ -n "$WORKFLOW_NAME_VALUE" ]; then
            jq --arg job_name "$JOB_NAME_VALUE" --arg workflow_name "$WORKFLOW_NAME_VALUE" '.failing_job_name = $job_name | .workflow_name = $workflow_name' "$MESSAGE_PATH" > "$TMP_JSON"
          elif [ -n "$JOB_NAME_VALUE" ]; then
            jq --arg job_name "$JOB_NAME_VALUE" '.failing_job_name = $job_name' "$MESSAGE_PATH" > "$TMP_JSON"
          elif [ -n "$WORKFLOW_NAME_VALUE" ]; then
            jq --arg workflow_name "$WORKFLOW_NAME_VALUE" '.workflow_name = $workflow_name' "$MESSAGE_PATH" > "$TMP_JSON"
          fi
          mv "$TMP_JSON" "$MESSAGE_PATH"
        fi

        AUTO_FIX_NOTE=""
        if [ -n "${AUTO_FIX_META:-}" ] && [ -f "$AUTO_FIX_META" ]; then
          AUTO_FIX_NOTE=$(jq -r '.auto_fix_pr_url // ""' "$AUTO_FIX_META" 2>/dev/null || echo "")
        fi

        # Build JOB OWNER ping string for deterministic failure cases (1/2/4)
        JOB_OWNER_PING=""
        JOB_OWNER_FILE=".auto_triage/data/job_owner.json"
        if [ -f "$JOB_OWNER_FILE" ]; then
          JOB_OWNER_PING=$(jq -r --arg allow "$ALLOW_PINGS" '
            [.[] | select(.name != "") |
              if ($allow == "true") and ((.slack_id // "") != "") then
                if (.slack_id | startswith("S")) then
                  "<!subteam^" + .slack_id + "|@" + .name + ">"
                else
                  "<@" + .slack_id + ">"
                end
              else
                .name
              end
            ] | join(", ")
          ' "$JOB_OWNER_FILE" 2>/dev/null || echo "")
          if [ -n "$JOB_OWNER_PING" ]; then
            echo "JOB OWNER ping string: $JOB_OWNER_PING"
          fi
        fi

        TEXT=$(jq -r \
          --arg run_url "$RUN_URL" \
          --arg run_label "$RUN_LABEL" \
          --arg job_name "$JOB_NAME_VALUE" \
          --arg workflow_name "$WORKFLOW_NAME_VALUE" \
          --arg auto_fix "$AUTO_FIX_NOTE" \
          --arg allow_pings "$ALLOW_PINGS" \
          --arg job_owner_ping "$JOB_OWNER_PING" '
          def short_hash(h):
            if (h // "") == "" then "unknown" else (h[0:8]) end;

          def commit_link(c):
            if (c.url // c.commit_url // "") != "" then
              "<" + (c.url // c.commit_url) + "|" + short_hash(c.hash // c.commit) + ">"
            else short_hash(c.hash // c.commit)
            end;

          def person(p; use_slack_id):
            if p == null then
              "Unknown"
            else
              # Only ping if allow_pings is true AND use_slack_id is true AND slack_id exists
              (if ($allow_pings == "true") and use_slack_id and (p.slack_id // "") != "" then
                # Groups/subteams start with "S" and use <!subteam^ID|@handle> format
                (if (p.slack_id | startswith("S")) then
                  "<!subteam^" + p.slack_id + "|@" + (p.name // p.login // "group") + ">"
                else
                  "<@" + p.slack_id + ">"
                end)
              else 
                (p.name // p.login // "Unknown")
              end)
            end;

          def join_people(arr; use_slack_id):
            arr | map(person(.; use_slack_id)) | join(", ");

          def ensure_case3_ping(arr; case_val):
            if ((case_val | tostring) == "3") then
              (arr // []) + [{ "name": "metalinfa", "slack_id": "S0985AN7TC5" }]
            else
              (arr // [])
            end;

          def section_line(lbl; txt):
            if (txt // "") != "" then "*\(lbl):* " + txt + "\n" else "" end;

          def section_people(lbl; arr; use_slack_id):
            if (arr | type) == "array" and (arr | length) > 0 then
              "*\(lbl):* " + join_people(arr; use_slack_id) + "\n"
            else "" end;

          def section_files(lbl; arr):
            if (arr | type) == "array" and (arr | length) > 0 then
              "*\(lbl):*\n```\n" + (arr | join("\n")) + "\n```\n"
            else "" end;

          def section_code(lbl; txt):
            if (txt // "") != "" then "*\(lbl):*\n```" + txt + "```\n" else "" end;

          def confidence_label(c):
            (c | if type == "string" then (tonumber? // 0) else . end) as $n
            | if $n == 100 then "HIGH CONFIDENCE"
              elif $n > 95 and $n < 100 then "MEDIUM CONFIDENCE"
              else "LOW CONFIDENCE"
              end;

          def commit_entry(c):
            "- HASH: " + commit_link(c) + "\n"
            + "  AUTHOR: " + person(c.author; true) + "\n"
            + (if (c.approvers | type) == "array" and (c.approvers | length) > 0 then
                "  APPROVERS: " + join_people(c.approvers; false) + "\n"
              else "" end)
            + (if (c.relevant_developers | type) == "array" and (c.relevant_developers | length) > 0 then
                "  RELEVANT DEVELOPERS: " + join_people(c.relevant_developers; false) + "\n"
              else "" end)
            + (if (c.relevant_files | type) == "array" and (c.relevant_files | length) > 0 then
                "  RELEVANT FILES:\n```\n" + (c.relevant_files | join("\n")) + "\n```\n"
              else "" end)
            + (if (c.confidence // null) != null then
                "  CONFIDENCE: " + confidence_label(c.confidence) + "\n"
              else "" end);

          def commits_section(arr):
            if (arr | type) == "array" and (arr | length) > 0 then
              "*COMMITS:*\n" + (arr | map(commit_entry(.)) | join("\n")) + "\n"
            else "" end;

          # Determine if commits exist (any case with commit entries)
          (if ((.commits | type) == "array" and (.commits | length) > 0) then true else false end) as $has_commits
          |
          (
            section_line("FULL REPORT"; "<\($run_url)|\($run_label)>")
            + section_line("FAILING WORKFLOW"; (if (($workflow_name // "") | length) > 0 then $workflow_name else (.workflow_name // "unknown workflow") end))
            + section_line("FAILING JOB"; (if (($job_name // "") | length) > 0 then $job_name else (.failing_job_name // .workflow_name // "unknown job") end))
            + section_line("FAILING TEST"; (.failing_test_name // "unknown test"))
            + section_line("FAILING RUN"; (if (.failing_run_url // "") != "" then "<\(.failing_run_url)|\(.failing_run_label // "latest failing run")>" else "" end))
            + section_line("SCENARIO"; .scenario)
            + section_code("FAILURE MESSAGE"; .failure_message)
            + commits_section(.commits)
            # Show and ping top-level relevant_developers when there are no commits (Cases 2/3),
            # and also for Case 5 where commit metadata is incomplete but we still want codeowners engaged.
            # When commits exist for Cases 1/4, relevant_developers are shown within commit entries (names only, no pings).
            + (if ($has_commits and ((.case | tostring) == "5"))
               then section_people("RELEVANT DEVELOPERS"; ensure_case3_ping(.relevant_developers; .case); true)
               elif $has_commits
               then ""
               else section_people("RELEVANT DEVELOPERS"; ensure_case3_ping(.relevant_developers; .case); true)
              end)
            + section_line("NOTES"; .notes)
            + (if ($auto_fix // "") != "" then "\n*AUTO-FIX:* Draft PR created -> <\($auto_fix)|link>\n" else "" end)
            + (if ($job_owner_ping != "") and ((.case | tostring) as $c | $c == "1" or $c == "2" or $c == "4") then "\n*JOB OWNER:* " + $job_owner_ping + "\n" else "" end)
            + "\n---\n_DISCLAIMER: This analysis has been done by AI. Do not take the results as absolute truth since it has been inaccurate in the past._"
          ) | gsub("\n{3,}"; "\n\n")
        ' "$MESSAGE_PATH")

        if [ -z "$TEXT" ]; then
          echo "Parsed Slack message is empty; skipping notification."
          echo "has_payload=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        
        # Write a JSON payload file. Using jq ensures proper JSON escaping of newlines
        # and special characters. The Slack action's payload-file-path input reads this file
        # and the JSON parser correctly interprets \n as newlines.
        PAYLOAD_FILE=".auto_triage/slack_payload.json"
        mkdir -p "$(dirname "$PAYLOAD_FILE")"
        
        if [ -n "$SLACK_TS" ]; then
          jq -n --arg text "$TEXT" --arg thread_ts "$SLACK_TS" \
            '{text: $text, thread_ts: $thread_ts}' > "$PAYLOAD_FILE"
        else
          jq -n --arg text "$TEXT" \
            '{text: $text}' > "$PAYLOAD_FILE"
        fi
        
        echo "payload_file=$PAYLOAD_FILE" >> "$GITHUB_OUTPUT"
        echo "has_payload=true" >> "$GITHUB_OUTPUT"

    - name: Report via Slack
      if: steps.build.outputs.has_payload == 'true'
      uses: slackapi/slack-github-action@v1.26.0
      with:
        # Use payload-file-path to ensure proper JSON encoding of newlines and special chars
        payload-file-path: ${{ steps.build.outputs.payload_file }}
        channel-id: ${{ inputs.channel_id }}
      env:
        SLACK_BOT_TOKEN: ${{ env.SLACK_BOT_TOKEN }}
        SLACK_WEBHOOK_URL: ${{ inputs.slack_webhook_url }}

    - name: Skip Slack notification
      if: steps.build.outputs.has_payload != 'true'
      shell: bash
      run: echo "ℹ️ No Slack payload produced; notification skipped."
