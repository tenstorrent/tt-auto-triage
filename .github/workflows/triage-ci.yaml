name: "(triage) CI Triage Orchestrator"

on:
  workflow_call:
    inputs:
      create-issues:
        description: "Create GitHub issues for deterministic failures"
        type: boolean
        default: false
      assign-owners:
        description: "Resolve assignees for already-created CI triage issues"
        type: boolean
        default: false
      slack-notify:
        description: "Post testing-channel Slack messages for issues with assignee metadata"
        type: boolean
        default: false
      issue-repo:
        description: "Repository containing the CI triage issues"
        type: string
        default: "ebanerjeeTT/issue_dump"
      target-repo:
        description: "Repository to read ownership metadata from"
        type: string
        default: "tenstorrent/tt-metal"
      max-issues:
        description: "Maximum number of issues to create (0 = unlimited)"
        type: number
        default: 0
      slack-channel-id:
        description: "Slack channel ID for triage notifications"
        type: string
        default: "C0APK6215B5"
      issue-numbers:
        description: >-
          OPTIONAL. Restrict assign-owners to a specific set of issues. Accepts
          bare numbers, `#123`, or full issue URLs, separated by commas or
          whitespace. Leave empty to process every open CI-triage issue.
        type: string
        default: ""
      skip-assigning-for-issues-that-already-have-owners:
        description: >-
          When true (default), skip any issue that already has a recommended-
          owner comment before running the resolver. If every targeted issue is
          already assigned, the workflow exits in seconds. Set to false to
          re-resolve unconditionally.
        type: boolean
        default: true
    secrets:
      AGGREGATE_READ_TOKEN:
        description: "Token with read access to target-repo"
        required: false
      ISSUE_WRITE_TOKEN:
        description: "Token with write access to issue-repo"
        required: true
      CURSOR_API_KEY:
        description: "Cursor API key (required for agent-based owner fallback)"
        required: false
      SLACK_BOT_TOKEN:
        description: "Optional Slack bot token for Slack-deleted employment check"
        required: false

jobs:
  create-issues:
    if: ${{ inputs.create-issues }}
    uses: ./.github/workflows/triage-create-issues.yaml
    with:
      issue-repo: ${{ inputs.issue-repo }}
      target-repo: ${{ inputs.target-repo }}
      max-issues: ${{ inputs.max-issues }}
    secrets:
      AGGREGATE_READ_TOKEN: ${{ secrets.AGGREGATE_READ_TOKEN }}
      ISSUE_WRITE_TOKEN: ${{ secrets.ISSUE_WRITE_TOKEN }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}

  assign-owners:
    if: ${{ inputs.assign-owners }}
    uses: ./.github/workflows/triage-assign-owners.yaml
    with:
      issue-repo: ${{ inputs.issue-repo }}
      target-repo: ${{ inputs.target-repo }}
      issue-numbers: ${{ inputs.issue-numbers }}
      skip-assigning-for-issues-that-already-have-owners: ${{ inputs.skip-assigning-for-issues-that-already-have-owners }}
    secrets:
      AGGREGATE_READ_TOKEN: ${{ secrets.AGGREGATE_READ_TOKEN }}
      ISSUE_WRITE_TOKEN: ${{ secrets.ISSUE_WRITE_TOKEN }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
