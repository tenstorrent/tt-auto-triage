name: "(triage) Bug Escapes"

# Called from tt-metal `.github/workflows/triage-ci.yaml` on branch `ebanerjee/bug-escapes`
# (workflow_dispatch there → reusable workflow here on `ebanerjee/bug-escapes`).
on:
  workflow_call:
    inputs:
      consecutive-runs:
        description: "Number of recent runs to evaluate per job"
        type: string
        default: "3"
    secrets:
      GITHUB_READ_TOKEN:
        description: "Token with read access to target-repo workflow runs (and related GitHub API reads)"
        required: true
      CURSOR_API_KEY:
        description: "Cursor CLI API key for agent-driven steps"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  bug-escapes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tt-auto-triage (bug-escapes branch)
        uses: actions/checkout@v4
        with:
          repository: tenstorrent/tt-auto-triage
          ref: ebanerjee/bug-escapes

      - name: Install Cursor CLI
        run: |
          set -euo pipefail
          install_script="$(mktemp)"
          curl --fail --show-error --silent --location \
            --proto '=https' --tlsv1.2 \
            https://cursor.com/install \
            -o "$install_script"
          bash "$install_script"
          rm -f "$install_script"
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Bug escapes (template)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_READ_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CONSECUTIVE_RUNS: ${{ inputs.consecutive-runs }}
        run: |
          set -euo pipefail
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "CURSOR_API_KEY is not set"
            exit 1
          fi
          echo "bug-escapes template: wired inputs and secrets (implement tools.ci or scripts next)."
          command -v agent || true
          agent --version 2>/dev/null || true

      - name: Summary
        if: always()
        run: |
          {
            echo "## Bug escapes (template)"
            echo "- **consecutive-runs**: ${{ inputs.consecutive-runs }}"
          } >> "$GITHUB_STEP_SUMMARY"
