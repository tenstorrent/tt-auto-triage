name: "(triage) Assign Owners"

on:
  workflow_call:
    inputs:
      issue-repo:
        description: "Repository that stores CI triage issues"
        type: string
        default: "ebanerjeeTT/issue_dump"
      target-repo:
        description: "Repository to read ownership metadata from"
        type: string
        default: "tenstorrent/tt-metal"
    secrets:
      AGGREGATE_READ_TOKEN:
        description: "Token with read access to target-repo"
        required: true
      ISSUE_WRITE_TOKEN:
        description: "Token with write access to issue-repo"
        required: true
      SLACK_BOT_TOKEN:
        description: "Optional Slack bot token for GitHub-to-Slack resolution"
        required: false

permissions:
  contents: read

jobs:
  assign-owners:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate required secrets
        env:
          AGGREGATE_READ_TOKEN: ${{ secrets.AGGREGATE_READ_TOKEN }}
          ISSUE_WRITE_TOKEN: ${{ secrets.ISSUE_WRITE_TOKEN }}
        run: |
          if [ -z "$ISSUE_WRITE_TOKEN" ]; then
            echo "::error::ISSUE_WRITE_TOKEN is required"
            exit 1
          fi
          if [ -z "$AGGREGATE_READ_TOKEN" ]; then
            echo "::error::AGGREGATE_READ_TOKEN is required to read ownership data from target-repo"
            exit 1
          fi

      - name: Checkout tt-auto-triage
        uses: actions/checkout@v4
        with:
          repository: tenstorrent/tt-auto-triage
          ref: ebanerjee/triage-assign-owners
          persist-credentials: false

      - name: Checkout target repo ownership data
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target-repo }}
          path: tt-metal
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            .github/actions/analyze-workflow-data/owners.json
            .github/CODEOWNERS
            .github/workflows
            tests/pipeline_reorg
          token: ${{ secrets.AGGREGATE_READ_TOKEN }}

      - name: Run assignee resolution stage
        env:
          GITHUB_TOKEN: ${{ secrets.AGGREGATE_READ_TOKEN }}
          ISSUE_WRITE_TOKEN: ${{ secrets.ISSUE_WRITE_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ISSUE_REPO: ${{ inputs.issue-repo }}
          TARGET_REPO: ${{ inputs.target-repo }}
          OWNERS_JSON_PATH: tt-metal/.github/actions/analyze-workflow-data/owners.json
          PIPELINE_REORG_DIR: tt-metal/tests/pipeline_reorg
          CODEOWNERS_PATH: tt-metal/.github/CODEOWNERS
          TARGET_REPO_ROOT: tt-metal
          GIT_HISTORY_MAX_COMMITS: "100"
          SUMMARY_OUTPUT: summary.md
          PYTHONPATH: .
        run: python3 -m tools.ci.assign_owners

      - name: Publish summary to run output
        if: always()
        run: |
          if [ -f summary.md ]; then
            cat summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary produced." >> "$GITHUB_STEP_SUMMARY"
          fi
