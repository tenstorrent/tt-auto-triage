name: "(triage) CI Triage Orchestrator"

on:
  workflow_call:
    inputs:
      create-issues:
        description: "Create GitHub issues for deterministic failures"
        type: boolean
        default: false
      issue-repo:
        description: "Repository to create issues in"
        type: string
        default: "ebanerjeeTT/issue_dump"
      target-repo:
        description: "Repository to analyze workflow data from"
        type: string
        default: "tenstorrent/tt-metal"
      max-issues:
        description: "Maximum number of issues to create (0 = unlimited)"
        type: string
        default: "0"
    secrets:
      AGGREGATE_READ_TOKEN:
        required: false
      ISSUE_WRITE_TOKEN:
        required: true
      CURSOR_API_KEY:
        required: false

jobs:
  create-issues:
    if: ${{ inputs.create-issues }}
    uses: ./.github/workflows/triage-create-issues.yaml
    with:
      issue-repo: ${{ inputs.issue-repo }}
      target-repo: ${{ inputs.target-repo }}
      max-issues: ${{ inputs.max-issues }}
    secrets:
      AGGREGATE_READ_TOKEN: ${{ secrets.AGGREGATE_READ_TOKEN }}
      ISSUE_WRITE_TOKEN: ${{ secrets.ISSUE_WRITE_TOKEN }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
