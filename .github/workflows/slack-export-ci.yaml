name: "(triage) Slack Data Export"

on:
  workflow_call:
    inputs:
      channel-id:
        required: false
        type: string
        default: "C0APK6215B5"
        description: "Slack channel ID to export"
      author-user-id:
        required: false
        type: string
        default: ""
        description: "Slack user ID to filter author threads (empty = skip author export)"
      days:
        required: false
        type: string
        default: "30"
        description: "Lookback window in days for author threads"
      channel-days:
        required: false
        type: string
        default: "14"
        description: "Lookback window in days for channel activity export"
      triage-logic-ref:
        required: false
        type: string
        default: "ebanerjee/slack-export"
    secrets:
      SLACK_BOT_TOKEN:
        required: true
      GITHUB_WRITE_TOKEN:
        required: true

  workflow_dispatch:
    inputs:
      channel-id:
        description: "Slack channel ID to export"
        required: false
        default: "C0APK6215B5"
      author-user-id:
        description: "Slack user ID to filter author threads (empty = skip author export)"
        required: false
        default: ""
      days:
        description: "Lookback window in days for author threads"
        required: false
        default: "30"
      channel-days:
        description: "Lookback window in days for channel activity export"
        required: false
        default: "14"
      triage-logic-ref:
        description: "Branch/tag/SHA in tenstorrent/tt-auto-triage for triage logic"
        required: false
        default: "ebanerjee/slack-export"

permissions:
  contents: read
  issues: read

jobs:
  slack-export:
    name: "Export and enrich Slack data"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tt-auto-triage logic
        uses: actions/checkout@v4
        with:
          repository: tenstorrent/tt-auto-triage
          ref: ${{ inputs.triage-logic-ref || 'ebanerjee/slack-export' }}
          path: .tt-auto-triage
          persist-credentials: false

      - name: Ensure SLACK_BOT_TOKEN is configured
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ]; then
            echo "::error::Missing secret SLACK_BOT_TOKEN"
            exit 1
          fi

      - name: Export author threads
        if: ${{ inputs.author-user-id != '' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          set -euo pipefail
          channel_id="${{ inputs.channel-id || 'C0APK6215B5' }}"
          author_id="${{ inputs.author-user-id }}"
          days="${{ inputs.days || '30' }}"
          python .tt-auto-triage/tools/ci/export_slack_author_threads.py \
            --channel-id "$channel_id" \
            --author-user-id "$author_id" \
            --days "$days" \
            --output "build_ci/raw_data/slack_${channel_id}_${author_id}_threads.json"

      - name: Enrich author threads with issue status
        if: ${{ inputs.author-user-id != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          channel_id="${{ inputs.channel-id || 'C0APK6215B5' }}"
          author_id="${{ inputs.author-user-id }}"
          f="build_ci/raw_data/slack_${channel_id}_${author_id}_threads.json"
          python .tt-auto-triage/tools/ci/enrich_slack_with_issue_status.py \
            --input "$f" --output "$f"

      - name: Upload author threads artifact
        if: ${{ inputs.author-user-id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: slack-export-author-threads
          path: build_ci/raw_data/slack_*_threads.json
          retention-days: 7

      - name: Export channel activity
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          set -euo pipefail
          channel_id="${{ inputs.channel-id || 'C0APK6215B5' }}"
          channel_days="${{ inputs.channel-days || '14' }}"
          python .tt-auto-triage/tools/ci/export_slack_channel.py \
            --channel-id "$channel_id" \
            --days "$channel_days" \
            --output "build_ci/raw_data/slack_${channel_id}_last_${channel_days}_days.json"

      - name: Enrich channel export with issue status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          channel_id="${{ inputs.channel-id || 'C0APK6215B5' }}"
          channel_days="${{ inputs.channel-days || '14' }}"
          f="build_ci/raw_data/slack_${channel_id}_last_${channel_days}_days.json"
          python .tt-auto-triage/tools/ci/enrich_slack_with_issue_status.py \
            --input "$f" --output "$f"

      - name: Upload channel export artifact
        uses: actions/upload-artifact@v4
        with:
          name: slack-export-raw-data
          path: build_ci/raw_data/
          retention-days: 7

      - name: Publish summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Slack Data Export Summary"
            echo
            echo "- Channel: \`${{ inputs.channel-id || 'C0APK6215B5' }}\`"
            echo "- Author filter: \`${{ inputs.author-user-id || '(none — skipped)' }}\`"
            echo "- Author lookback: ${{ inputs.days || '30' }} days"
            echo "- Channel lookback: ${{ inputs.channel-days || '14' }} days"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          for f in build_ci/raw_data/slack_*.json; do
            if [ -s "$f" ]; then
              counts=$(python3 -c "
          import json, pathlib
          p = json.loads(pathlib.Path('$f').read_text())
          c = p.get('counts', {})
          print('| \`$(basename $f)\` | ' + ' | '.join(f'{k}: {v}' for k,v in c.items()) + ' |')
          " 2>/dev/null || echo "| \`$(basename $f)\` | (parse error) |")
              echo "$counts" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
