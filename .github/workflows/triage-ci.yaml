name: "(triage) CI Triage Orchestrator"

on:
  workflow_call:
    inputs:
      create-issues:
        description: "Create GitHub issues for deterministic failures"
        type: boolean
        default: false
      issue-repo:
        description: "Repository to create issues in"
        type: string
        default: "ebanerjeeTT/issue_dump"
      target-repo:
        description: "Repository to analyze workflow data from"
        type: string
        default: "tenstorrent/tt-metal"
      max-issues:
        description: "Maximum number of issues to create (0 = unlimited)"
        type: number
        default: 0
      llm-backend:
        description: "LLM backend for issue drafting: 'cursor' (default) or 'copilot'"
        type: string
        default: "cursor"
      workflow-filter:
        description: "Comma-separated substrings to filter workflow names (e.g. 'ops-unit-tests,Blackhole'). Empty = all."
        type: string
        default: ""
      consecutive-failures-high-volume:
        description: "Consecutive failures required to file an issue for high-volume workflows (more than 'high-volume-runs-per-day' main runs in last 24h)."
        type: number
        default: 4
      consecutive-failures-low-volume:
        description: "Consecutive failures required to file an issue for low-volume workflows."
        type: number
        default: 2
      high-volume-runs-per-day:
        description: "Strict cutoff (>) for classifying a workflow as high-volume."
        type: number
        default: 5
    secrets:
      AGGREGATE_READ_TOKEN:
        required: false
      ISSUE_WRITE_TOKEN:
        required: true
      CURSOR_API_KEY:
        required: false
      COPILOT_PAT:
        required: false

jobs:
  create-issues:
    if: ${{ inputs.create-issues }}
    uses: ./.github/workflows/triage-create-issues.yaml
    with:
      issue-repo: ${{ inputs.issue-repo }}
      target-repo: ${{ inputs.target-repo }}
      max-issues: ${{ inputs.max-issues }}
      llm-backend: ${{ inputs.llm-backend }}
      workflow-filter: ${{ inputs.workflow-filter }}
      consecutive-failures-high-volume: ${{ inputs.consecutive-failures-high-volume }}
      consecutive-failures-low-volume: ${{ inputs.consecutive-failures-low-volume }}
      high-volume-runs-per-day: ${{ inputs.high-volume-runs-per-day }}
    secrets:
      AGGREGATE_READ_TOKEN: ${{ secrets.AGGREGATE_READ_TOKEN }}
      ISSUE_WRITE_TOKEN: ${{ secrets.ISSUE_WRITE_TOKEN }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      COPILOT_PAT: ${{ secrets.COPILOT_PAT }}
