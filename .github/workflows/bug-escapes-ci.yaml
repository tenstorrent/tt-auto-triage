name: "(triage) Bug Escapes"

# Called from tt-metal `.github/workflows/triage-ci.yaml` on branch `ebanerjee/bug-escapes`
# (workflow_dispatch there → reusable workflow here on `ebanerjee/bug-escapes`).
on:
  workflow_call:
    inputs:
      consecutive-runs:
        description: "Number of recent runs to evaluate per job"
        type: string
        default: "3"
    secrets:
      GITHUB_READ_TOKEN:
        description: "Token with read access to target-repo workflow runs (and related GitHub API reads)"
        required: true
      CURSOR_API_KEY:
        description: "Cursor CLI API key for agent-driven steps"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  bug-escapes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout tt-auto-triage (bug-escapes branch)
        uses: actions/checkout@v4
        with:
          repository: tenstorrent/tt-auto-triage
          ref: ebanerjee/bug-escapes

      - name: Install Cursor CLI
        run: |
          set -euo pipefail
          install_script="$(mktemp)"
          curl --fail --show-error --silent --location \
            --proto '=https' --tlsv1.2 \
            https://cursor.com/install \
            -o "$install_script"
          bash "$install_script"
          rm -f "$install_script"
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Validate secrets
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "::error::CURSOR_API_KEY is not set"
            exit 1
          fi
          cursor agent --version 2>/dev/null || echo "::warning::cursor agent version check failed"

      - name: Run bug escape detection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_READ_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CONSECUTIVE_RUNS: ${{ inputs.consecutive-runs }}
        run: |
          set -euo pipefail
          chmod +x bug-escapes/run.sh
          ./bug-escapes/run.sh

      - name: Upload bug escapes artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bug-escapes-output
          path: bug-escapes/output/bug-escapes-output.json
          retention-days: 30
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          if [ -f bug-escapes/output/bug-escapes-output.json ]; then
            total=$(jq '.bug_escapes | length' bug-escapes/output/bug-escapes-output.json)
            horizontal=$(jq '[.bug_escapes[] | select(.type == "horizontal")] | length' bug-escapes/output/bug-escapes-output.json)
            vertical=$(jq '[.bug_escapes[] | select(.type == "vertical")] | length' bug-escapes/output/bug-escapes-output.json)
            {
              echo "## Bug Escape Detection"
              echo "- **consecutive-runs threshold**: ${{ inputs.consecutive-runs }}"
              echo "- **Total bug escapes**: $total"
              echo "  - Horizontal: $horizontal"
              echo "  - Vertical: $vertical"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Bug Escape Detection"
              echo "- **Status**: No output produced"
              echo "- **consecutive-runs threshold**: ${{ inputs.consecutive-runs }}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
